name: ts

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Finish production deployments; only superseded pull request runs can be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: lint, types, tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The e2e container's tag must match the installed Playwright exactly, so it
      # is read from the package the lockfile resolved, not kept in sync by hand.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The photo tests run in a real headless Chromium (tests/*.browser.test.ts).
      - run: pnpm run test:setup --with-deps

      - run: pnpm run check
      - run: pnpm run typecheck
      - run: pnpm run coverage --coverage.reporter=lcov

      # Dependabot pull requests get no secrets, so their upload fails without failing CI.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
      - run: pnpm run build
      - run: pnpm run budget
      # Deploy exactly the checked build, including .well-known/security.txt.
      - if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      # Known advisories, moderate and up, in what ships: dependencies, not dev tooling.
      - run: pnpm audit --prod --audit-level=moderate

  e2e:
    name: e2e (chromium)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The browser and its system libraries come with the image, at the version the
    # check job read from the lockfile, so a Playwright bump needs no edit here. That
    # tag comes from the lockfile, so no digest can be pinned next to it.
    container:
      # jactionlint ignore=unpinned-images
      image: mcr.microsoft.com/playwright:v${{ needs.check.outputs.playwright }}-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Without a Latin font, the image falls back to a CJK font whose narrow Latin
      # glyphs can hide text that overflows with the fonts real browsers use.
      - run: apt-get update && apt-get install -y --no-install-recommends fonts-dejavu-core

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # docs/architecture.md describes the preview lifecycle. Fork pull requests never get
  # the token, so they skip with a notice, as does a repo without the secret.
  preview:
    name: preview
    # Bot pull requests (Renovate, Dependabot) get no preview, so their code never sees the token.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && !endsWith(github.event.pull_request.user.login, '[bot]')
    # Shares the web app job of preview-retire.yml, so a retire waits for a deploy in flight.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    steps:
      - id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          missing=""
          [ -n "$TOKEN" ] || missing=CLOUDFLARE_API_TOKEN
          [ -n "$ACCOUNT" ] || missing="${missing:+$missing and }CLOUDFLARE_ACCOUNT_ID"
          if [ "$FORK" = "true" ]; then
            echo "::notice::Preview skipped: fork PR."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "::notice::Preview skipped: $missing not set."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.gate.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # Search engines should index the production site, not the preview copies. This
      # block is appended to the build's own _headers, which keeps its security headers.
      - if: steps.gate.outputs.run == 'true'
        run: |
          printf '\n/*\n  X-Robots-Tag: noindex\n' >> dist/_headers

      - if: steps.gate.outputs.run == 'true'
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |-
          # This job may have queued behind a close or a draft switch: a retire that
          # ran first must not be undone by a deploy.
          state=$(gh api "repos/$REPO/pulls/$PR" --jq '.state + " " + (.draft|tostring)')
          if [ "$state" != "open false" ]; then
            echo "::notice::Preview skipped: pull request $PR is no longer open and ready ($state)."
            exit 0
          fi
          "$GITHUB_WORKSPACE/.github/scripts/deploy-worker.sh" Preview "bikespot-pr-$PR"

  # Production: every push to main deploys the build the checks ran on. Without the
  # token, it skips with a notice.
  production:
    name: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Never cancelled halfway, so a deploy in flight finishes before the next starts.
    concurrency:
      group: production
      cancel-in-progress: false
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$TOKEN" ] || missing=CLOUDFLARE_API_TOKEN
          [ -n "$ACCOUNT" ] || missing="${missing:+$missing and }CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::notice::Production deploy skipped: $missing not set."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.gate.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - if: steps.gate.outputs.run == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: '"$GITHUB_WORKSPACE/.github/scripts/deploy-worker.sh" Production'
