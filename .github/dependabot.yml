version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      npm-updates:
        patterns:
          - "*"
      # Advisories arrive outside the weekly window and ignore the groups above,
      # so without this each one opens its own pull request and its own CI run.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - infrastructure
    groups:
      action-updates:
        patterns:
          - "*"
    cooldown:
      default-days: 3
