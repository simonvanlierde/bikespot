<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Apply a forced light/dark choice before first paint to avoid a flash.
         Kept in sync with src/lib/theme.ts (same key, same attribute). -->
    <script>
      try {
        const t = localStorage.getItem("bikespot-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1522" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Bikespot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
