# pnpm reads its project settings here, not from .npmrc. One package, so no
# `packages:` list.

# Resolve only releases at least a week old (in minutes): a compromised release
# is usually caught and yanked within that window. Dependabot's cooldown waits
# the same.
minimumReleaseAge: 10080

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
overrides:
  "@babel/core": ^7.29.6
  "@babel/plugin-transform-modules-systemjs": ^7.29.4
  serialize-javascript: ^7.0.5
  # GHSA-qw65-cvwx-89v3 and six earlier fast-uri advisories (via workbox-build > ajv); drop once ajv requires >=3.1.7.
  fast-uri: ^3.1.7
  # GHSA-73wf-gq98-2v4g, and GHSA-w5vr-8v7q-w6rv in its baseline-browser-mapping dependency (via workbox-build > @babel/preset-env); drop once the lockfile resolves >=4.29 without it.
  browserslist: ^4.28.7
  # GHSA-q2hr-2g5m-vwhr and GHSA-3jxr-9vmj-r5cp (via workbox-build > ejs > jake and glob); drop once workbox-build resolves patched minimatch trees.
  brace-expansion@2: ^2.1.7
  brace-expansion@5: ^5.0.12
